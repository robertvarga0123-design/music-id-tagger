name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Test
        run: |
          python -m pytest -q
          python -m ruff check

      - name: Build app folder
        run: python -m PyInstaller --noconfirm --clean MusicIDTagger.spec

      - name: Upload portable folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicIDTagger-portable
          path: dist/MusicIDTagger/
          if-no-files-found: error

      - name: Install Inno Setup and compile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:TEMP "innosetup.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $dest
          Start-Process -FilePath $dest -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nem található" }
          & $iscc "installer\MusicIDTagger.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC hiba: $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MusicIDTagger-Setup
          path: installer/Output/MusicIDTagger-Setup.exe
          if-no-files-found: error
